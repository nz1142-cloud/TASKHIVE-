{% extends 'base.html' %}

{% block title %}Place Bid{% endblock %}

{% block content %}

<h1>Place Your Bid</h1>

<p>
    Task: {{ task.title }}
</p>

<form method="POST">

    {% csrf_token %}

    <label>Your Amount</label>
    <input
        type="number"
        name="amount"
        step="0.01"
        required
    >

    <label>Why are you the best for this job?</label>

    <textarea
        name="message"
        required
    ></textarea>

    <button type="submit">
        Submit Bid
    </button>

</form>

{% endblock %}
